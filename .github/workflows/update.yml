name: Update dist DB
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      [
        "gatelogue-aggregator/**",
        "gatelogue-types-py/**",
        ".github/workflows/update.yml",
      ]
  schedule:
    - cron: 0 0 * * *

env:
  FORCE_COLOR: "1"
  NO_PROGRESS_BAR: "1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dist
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gatelogue
          key: gatelogue-data
      - run: bash update.sh -ce "*"
      - uses: EndBug/add-and-commit@fc1cf1dd8747466e3313305ba0d26460c62a7e59 # v11.1.0
        with:
          default_author: github_actions
          message: Update Gatelogue data

  trigger-map:
    needs: update
    permissions:
      contents: write
    uses: ./.github/workflows/trigger-map.yml
    secrets:
      PAT: ${{ secrets.PAT }}
