name: Test
on:
  push:
    branches: ["**", "!renovate/**", "!lint/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      node: ${{ steps.filter.outputs.node }}
      python: ${{ steps.filter.outputs.python }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'gatelogue-types-rs/**'
              - '.config/**'
              - '.github/workflows/test.yml'
            node:
              - 'gatelogue-types-ts/**'
              - 'gatelogue-client/**'
              - '.config/**'
              - '.github/workflows/test.yml'
            python:
              - 'gatelogue-aggregator/**'
              - 'gatelogue-types-py/**'
              - '.config/**'
              - '.github/workflows/test.yml'

  test-types-py:
    name: Test Python types
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gatelogue-types-py
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          envs: "py"

      - run: hatch test --all --parallel

  test-types-rs:
    name: Test Rust types
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gatelogue-types-rs
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          envs: "rs"

      - run: cargo test --locked --all --all-targets --all-features

  test-types-ts:
    name: Test TypeScript types
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gatelogue-types-ts
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          envs: "node"

      - run: pnpm i
      - run: pnpm test
